[project]
name = "fpl-decision-engine"
version = "0.1.0"
description = "Autonomous Fantasy Premier League decision-support system."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "httpx",
    "pulp",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Domain enums are deliberately `class Foo(str, Enum)` rather than
# `enum.StrEnum` — this is an explicit, intentional design choice (not a
# style oversight), so UP042 is suppressed here only.
"packages/domain/jobs.py" = ["UP042"]
"packages/domain/rules.py" = ["UP042"]
"packages/domain/ingestion.py" = ["UP042"]
"packages/domain/optimization.py" = ["UP042"]
"packages/domain/modeling.py" = ["UP042"]
"packages/domain/transfers.py" = ["UP042"]
"packages/domain/h2h.py" = ["UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
