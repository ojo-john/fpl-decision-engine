name: FPL Scout Watch

# Twice-weekly (Monday early-week roundup, Thursday night pre-deadline check --
# most gameweek deadlines fall Friday evening, and the most decision-relevant news
# lands Wed-Fri, right before them), standalone research digest -- reads real FPL
# "scout"/tips sites (the same ones the user pointed at directly: Premier League's
# own Scout coverage and Fantasy Football Scout) via the Gemini API's Google Search
# grounding tool, and opens a GitHub issue proposing player_availability_risk_notes
# / player_role_notes updates for a human (or an agent, next session) to review and
# apply.
#
# Deliberately "research + propose only", never "apply directly": exactly like
# league-watch.yml, this workflow cannot reach the app's own local database (this
# project has never been deployed anywhere with a public, GitHub-reachable
# database -- see ARCHITECTURE.md's "On-demand data refresh" section for the full
# constraint) even if it wanted to write a note itself. So every run just produces
# a digest issue; nothing in the running app changes until someone reads it and
# applies whatever's genuinely useful via the real POST /players/{id}/availability-
# risk-notes or POST /players/{id}/role-notes endpoints, the same way every note
# seeded so far this season was created.
#
# Uses Google's Gemini API (not Anthropic's) -- see the GEMINI_API_KEY secret.
# Measured from a real run's actual usage: well under $0.01/run (a handful of
# grounded searches, comfortably within Gemini 2.5 Flash's free daily grounding
# allowance at this call volume) -- genuinely cheap, though NOT the "no credit
# card, ever" free tier this doc originally assumed; see ARCHITECTURE.md's own
# "FPL Scout Watch" section for the real, live-debugged story (new AI Studio
# projects need a one-time ~$10 prepaid balance and the Gemini API explicitly
# enabled on the underlying Cloud project before grounding works at all).
# Requires GEMINI_API_KEY as a repo secret; the job fails loudly (not silently)
# if it's missing.
#
# Unlike league-watch.yml, this does NOT try to diff against previous state and
# stay silent on "no change" -- natural-language news content doesn't have a clean
# automatable "nothing changed" signal the way a structured JSON API response
# does, so every scheduled run opens a fresh digest issue (labeled
# fpl-scout-digest) rather than guessing at whether last week's findings are
# still current.
#
# TWO SEQUENTIAL Gemini calls, not one -- added after a real, live run of this
# workflow confidently reported that Arsenal's William Saliba "underwent back
# surgery," when independent sources actually confirm surgery was explicitly
# RULED OUT. That error was only caught by manual human review. The first call
# (research pass) drafts findings exactly as before; the second call
# (verification pass) is handed those draft findings PLUS this repo's own
# squad/known-notes state and is instructed to independently re-search and
# confirm/correct/retract each one via fresh search, not just rubber-stamp the
# draft. The issue body is built from the SECOND pass's output only -- corrected
# findings show the correction inline (via CORRECTION_NOTE), not both versions
# side by side. Still just two calls, not an elaborate multi-round debate --
# measured cost for the pair is well under $0.01.
#
# Squad-aware + duplicate-aware: the verification prompt also embeds
# .github/state/current-squad.json (the user's real decided squad -- manually
# maintained, see that file's own _comment for why this can't auto-sync the way
# league-watch.yml's state does) and .github/state/known-notes-snapshot.json (a
# snapshot of every currently-active note the real app already knows about,
# regenerated via scripts/export_notes_snapshot.py -- see that script's
# docstring). Findings about a squad player get a "⚠️ IN YOUR SQUAD" marker;
# findings that duplicate an already-active note get a "✅ ALREADY KNOWN" marker
# instead of being re-proposed as new.
#
# Known gotcha, confirmed live against a brand-new key/project at the time this
# workflow was first built: model/key/endpoint were all correct (a plain,
# tool-less call returned a clean 200), but the FIRST several grounded requests
# 429'd with "exceeded your current quota" -- Google's own free-tier Search
# grounding quota is known to sometimes provision with a delay (or need a fresh
# key/project) separately from base model access; see
# https://discuss.ai.google.dev/t/gemini-api-429-resource-exhausted-error-on-tier-1/114413.
# If this job starts failing with a 429 whose body says "too_many_requests" /
# "exceeded your current quota" even though GEMINI_API_KEY is definitely set
# correctly, this is very likely that same provisioning quirk, not a bug in
# this workflow -- retry later (the weekly schedule will do this on its own)
# before assuming the request shape itself is wrong.

on:
  schedule:
    # Monday morning -- early-week roundup.
    - cron: "22 8 * * 1"
    # Thursday night (UTC) -- most FPL gameweek deadlines fall Friday evening
    # (occasionally Saturday), and the most decision-relevant news (press
    # conferences, final fitness/team-news updates) lands Wed-Fri, right
    # before the deadline -- a Monday-only run would miss exactly that.
    - cron: "47 21 * * 4"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Call Gemini API with Google Search grounding (research pass)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set -- cannot run the scout research step."
            exit 1
          fi

          PROMPT=$(cat <<'PROMPT_EOF'
          You are researching real, current Fantasy Premier League (FPL) news for the
          2026-27 Premier League season, to propose updates to a decision-support app's
          two curated-note mechanisms:

          1. "Availability risk" notes -- a DISCOUNT (multiplier in (0, 1], e.g. 0.65 =
             reduced to 65%) applied to a player's projected points for a gameweek range,
             for judgment-based reasons FPL's own official injury/status data hasn't
             caught up to yet (e.g. a player short on match sharpness after a long
             international tournament, carrying a knock not yet officially listed,
             or a new signing still integrating into a squad).
          2. "Role" notes -- a BOOST (multiplier normally > 1.0, e.g. 1.15 = increased
             to 115%) for a player CONFIRMED to have taken on new set-piece duty
             (penalties, corners, free-kicks) that increases their real expected
             returns beyond what historical data alone would suggest.

          Research real, current, well-sourced news from Premier League's own Scout
          coverage (premierleague.com/en/the-scout and related news articles) and
          Fantasy Football Scout (fantasyfootballscout.co.uk) -- and other credible
          sources if useful (Sky Sports, BBC Sport, official club statements) --
          covering: (a) any NEW injury, fitness, or availability concern for a
          notable Premier League player not yet reflected in official FPL status,
          (b) any CONFIRMED change in who takes penalties/corners/free-kicks for a
          club, (c) any other genuinely decision-relevant news for FPL squad
          building this week.

          For EACH real, sourced finding, output a clearly delimited block in
          exactly this format so it can be reviewed and applied via this app's own
          API:

          ---
          PLAYER: <player name, and club if there's any ambiguity>
          CATEGORY: <availability_risk | role_boost>
          SUGGESTED_SEVERITY: <a decimal multiplier, e.g. 0.7 or 1.15 -- your best
            reasoned estimate, not a precise science>
          SUGGESTED_GAMEWEEK_RANGE: <e.g. "GW1-3" or "open-ended" if this looks like
            a longer-term role change rather than a short-term recovery window>
          REASON: <2-4 sentences, the real sourced explanation, written the way you'd
            want it to read as a permanent audit-trail note -- include what you found
            and where>
          SOURCES: <list the actual URLs/outlets you found this from>
          ---

          Do NOT fabricate or guess at findings you can't actually source via search
          -- if you don't find anything genuinely new and well-sourced this week for
          a particular category, say so plainly ("No new [X] found this week") rather
          than inventing a plausible-sounding entry. Accuracy matters far more than
          always having something to report. Aim for quality over quantity -- 2-3
          well-sourced findings beats 10 speculative ones.
          PROMPT_EOF
          )

          PROMPT_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" <<< "$PROMPT")

          cat > request.json <<EOF
          {
            "model": "gemini-flash-latest",
            "input": $PROMPT_JSON,
            "tools": [{"type": "google_search"}]
          }
          EOF

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)
          echo "HTTP status: $HTTP_STATUS"
          cat response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Gemini API returned HTTP $HTTP_STATUS -- see response.json above for details."
            exit 1
          fi

      - name: Extract research-pass findings
        run: |
          python3 - <<'EOF'
          import json

          with open("response.json") as f:
              data = json.load(f)

          text_parts = []
          queries = []
          for step in data.get("steps", []):
              step_type = step.get("type")
              if step_type == "google_search_call":
                  queries.extend(step.get("queries", []))
              elif step_type == "model_output":
                  for block in step.get("content", []):
                      if block.get("text"):
                          text_parts.append(block["text"])

          digest_text = "\n\n".join(text_parts).strip()
          if not digest_text:
              digest_text = (
                  "No model output was extracted from the research-pass Gemini "
                  "response -- see the raw response.json artifact for debugging."
              )

          with open("step1_findings.md", "w") as f:
              f.write(digest_text)
          with open("step1_queries.json", "w") as f:
              json.dump(queries, f)
          EOF

      - name: Build verification-pass prompt
        run: |
          python3 - <<'EOF'
          import json

          with open("step1_findings.md") as f:
              draft_findings = f.read().strip()

          with open(".github/state/current-squad.json") as f:
              squad = json.load(f)

          with open(".github/state/known-notes-snapshot.json") as f:
              known_notes = json.load(f)

          squad_json = json.dumps(squad, indent=2)
          known_notes_json = json.dumps(known_notes, indent=2)

          prompt = f"""You are performing a FRESH, INDEPENDENT verification pass over
          draft FPL findings a previous research pass produced. Your job is to catch
          errors before a human sees them: a real earlier run of this exact process
          confidently reported that Arsenal's William Saliba "underwent back surgery,"
          when independent sources actually confirm surgery was explicitly RULED OUT.
          That error only got caught by manual human review. Do not repeat it.

          For EACH draft finding below, use Google Search again -- actually re-verify
          it against fresh, independent sources, do not just re-read the claim -- and
          decide:
          - CONFIRMED: independently corroborated by fresh search.
          - CORRECTED: sources disagree with some detail -- keep the finding but fix
            it, and explain exactly what changed and why.
          - RETRACTED: you cannot find independent corroboration, or sources actively
            contradict it.

          Then cross-reference each CONFIRMED or CORRECTED finding's player against
          two lists and prepend the matching marker(s):

          1. SQUAD_FLAG -- this is the user's real current FPL squad (starting XI +
             bench). If the finding's player appears here, use "IN YOUR SQUAD",
             otherwise use "".

          {squad_json}

          2. DUPLICATE_FLAG -- these are notes ALREADY ACTIVE in the app right now.
             If the finding's player + category is already covered by one of these
             (same player, same category, overlapping gameweek range, comparable
             severity/role), use "ALREADY KNOWN" and say in CORRECTION_NOTE what's
             already there instead of re-proposing it as new. If the finding
             meaningfully updates or contradicts an existing note, keep STATUS as
             CONFIRMED or CORRECTED, leave DUPLICATE_FLAG "", and say in
             CORRECTION_NOTE that it supersedes the existing note. Otherwise use "".

          {known_notes_json}

          Output EXACTLY one block per draft finding (including RETRACTED ones, so
          the audit trail is clear) in this format:

          ---
          STATUS: <CONFIRMED | CORRECTED | RETRACTED>
          PLAYER: <player name, and club if there's any ambiguity>
          SQUAD_FLAG: <IN YOUR SQUAD | (empty)>
          DUPLICATE_FLAG: <ALREADY KNOWN | (empty)>
          CATEGORY: <availability_risk | role_boost>
          SUGGESTED_SEVERITY: <a decimal multiplier, e.g. 0.7 or 1.15>
          SUGGESTED_GAMEWEEK_RANGE: <e.g. "GW1-3" or "open-ended">
          REASON: <2-4 sentences, the real sourced explanation, written the way you'd
            want it to read as a permanent audit-trail note>
          CORRECTION_NOTE: <if STATUS is CORRECTED or RETRACTED, or DUPLICATE_FLAG is
            "ALREADY KNOWN", explain exactly what changed/why versus the draft below
            or what the existing note already says; otherwise "n/a">
          SOURCES: <the actual URLs/outlets you found this from during this pass>
          ---

          If the draft findings below say nothing new was found, confirm that plainly
          rather than inventing anything. Draft findings to verify:

          {draft_findings}
          """

          with open("verification_prompt.txt", "w") as f:
              f.write(prompt)
          EOF

      - name: Call Gemini API with Google Search grounding (verification pass)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" < verification_prompt.txt)

          cat > request2.json <<EOF
          {
            "model": "gemini-flash-latest",
            "input": $PROMPT_JSON,
            "tools": [{"type": "google_search"}]
          }
          EOF

          HTTP_STATUS=$(curl -s -o response2.json -w "%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request2.json)
          echo "HTTP status: $HTTP_STATUS"
          cat response2.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Gemini API (verification pass) returned HTTP $HTTP_STATUS -- see response2.json above for details."
            exit 1
          fi

      - name: Extract verified findings and build the issue body
        run: |
          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone

          with open("response2.json") as f:
              data = json.load(f)

          with open("step1_queries.json") as f:
              queries = json.load(f)

          text_parts = []
          for step in data.get("steps", []):
              step_type = step.get("type")
              if step_type == "google_search_call":
                  queries.extend(step.get("queries", []))
              elif step_type == "model_output":
                  for block in step.get("content", []):
                      if block.get("text"):
                          text_parts.append(block["text"])

          digest_text = "\n\n".join(text_parts).strip()
          if not digest_text:
              digest_text = (
                  "_No model output was extracted from the verification-pass Gemini "
                  "response -- see the raw response2.json artifact for debugging._"
              )

          queries_note = ""
          if queries:
              queries_note = "\n\n**Searches run (both passes):** " + ", ".join(
                  f"`{q}`" for q in queries
              )

          body = (
              f"Automated FPL scout-site research digest -- proposals only, nothing "
              f"has been applied to the app. Findings below have already been through "
              f"a second, independent verification pass (fresh search re-check against "
              f"this repo's current squad and already-active notes) -- see "
              f"CORRECTION_NOTE on any finding that was corrected or retracted "
              f"relative to the first draft, and SQUAD_FLAG / DUPLICATE_FLAG for "
              f"squad and duplicate-note cross-references.\n\n"
              f"Review each finding below and apply anything genuinely useful via "
              f"`POST /players/{{id}}/availability-risk-notes` or "
              f"`POST /players/{{id}}/role-notes` against the real running app.\n"
              f"{queries_note}\n\n---\n\n{digest_text}\n\n---\n"
              f"_Generated {datetime.now(timezone.utc).isoformat()}_"
          )

          with open("issue_body.md", "w") as f:
              f.write(body)
          EOF

      - name: Open the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "FPL scout digest -- $(date -u +%Y-%m-%d)" \
            --body-file issue_body.md \
            --label "fpl-scout-digest"

      - name: Upload raw responses for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-responses
          path: |
            response.json
            response2.json
