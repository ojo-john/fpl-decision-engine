name: DIAG TEMP palmer check

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Compare real Palmer vs Anderson data and projections
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import select
          from packages.database.models.player import Player
          from packages.database.models.player_features import PlayerFeatures
          from packages.database.models.player_gameweek_stats import PlayerGameweekStats
          from packages.database.models.gameweek import Gameweek
          from packages.database.models.season import Season
          from packages.database.models.team import Team
          from packages.database.session import SessionLocal
          from app.optimization.champion_loader import load_current_champion
          from app.optimization.projection import project_player_with_champion

          session = SessionLocal()
          try:
              season_id = session.execute(select(Season.id).where(Season.is_current.is_(True))).scalar_one()

              def dump(name_like):
                  players = session.execute(
                      select(Player).where(Player.season_id == season_id, Player.web_name.ilike(f"%{name_like}%"))
                  ).scalars().all()
                  for p in players:
                      team = session.get(Team, p.team_id) if p.team_id else None
                      print(f"\n=== {p.web_name} ({team.name if team else '?'}) id={p.id} ===")
                      print(f"status={p.status}, chance_of_playing_next_round={p.chance_of_playing_next_round}, "
                            f"news={p.news!r}")
                      print(f"now_cost={p.now_cost}, total_points={p.total_points}, minutes={p.minutes}, "
                            f"form={p.form}, points_per_game={p.points_per_game}, ep_next={p.ep_next}")

                      feat = session.execute(
                          select(PlayerFeatures)
                          .where(PlayerFeatures.player_id == p.id)
                          .order_by(PlayerFeatures.computed_at.desc())
                          .limit(1)
                      ).scalar_one_or_none()
                      if feat:
                          print(f"features: computed_at={feat.computed_at}, "
                                f"rolling_avg_points_3gw={feat.rolling_avg_points_3gw}, "
                                f"rolling_avg_points_5gw={feat.rolling_avg_points_5gw}, "
                                f"rolling_avg_minutes_3gw={feat.rolling_avg_minutes_3gw}, "
                                f"rolling_avg_minutes_5gw={feat.rolling_avg_minutes_5gw}")

                      recent = session.execute(
                          select(PlayerGameweekStats, Gameweek.fpl_event_id)
                          .join(Gameweek, Gameweek.id == PlayerGameweekStats.gameweek_id)
                          .where(PlayerGameweekStats.player_id == p.id)
                          .order_by(Gameweek.fpl_event_id.desc())
                          .limit(6)
                      ).all()
                      print("recent gameweeks (newest first):")
                      for stats, event_id in recent:
                          print(f"  GW{event_id}: minutes={stats.minutes}, points={stats.total_points}, "
                                f"started={stats.starts}")

                      upcoming = session.execute(
                          select(Gameweek)
                          .where(Gameweek.season_id == season_id, Gameweek.finished.is_(False))
                          .order_by(Gameweek.deadline_time.asc())
                          .limit(6)
                      ).scalars().all()
                      champion = load_current_champion(session)
                      print(f"projections (champion loaded: {champion is not None}):")
                      for gw in upcoming:
                          proj = project_player_with_champion(session, p, gw.id, champion)
                          print(f"  GW{gw.fpl_event_id}: projected={proj.projected_points:.2f}, "
                                f"source={proj.source}, eligible={proj.is_eligible}")

              dump("Palmer")
              dump("Anderson")
          finally:
              session.close()
          EOF
