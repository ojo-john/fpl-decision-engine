name: DIAG TEMP backtest artifact check

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Inspect every model_versions row's artifact_bytes status
        run: |
          uv run python - <<'EOF'
          import io
          import traceback

          import joblib
          from sqlalchemy import select

          from packages.database.models.model_version import ModelVersion
          from packages.database.session import SessionLocal

          session = SessionLocal()
          try:
              rows = session.execute(
                  select(ModelVersion).order_by(ModelVersion.trained_at.desc())
              ).scalars().all()
              print(f"Found {len(rows)} model_versions row(s) total.\n")
              for row in rows:
                  artifact_bytes = row.artifact_bytes
                  champion_marker = " <-- CURRENT CHAMPION" if row.is_champion else ""
                  print(
                      f"id={row.id}, family={row.model_family.value}, trained_at={row.trained_at}, "
                      f"lifecycle_state={row.lifecycle_state.value}, is_champion={row.is_champion}, "
                      f"artifact_bytes={'NULL' if artifact_bytes is None else f'{len(artifact_bytes)} bytes'}"
                      f"{champion_marker}"
                  )
                  if row.is_champion and artifact_bytes is not None:
                      try:
                          model = joblib.load(io.BytesIO(artifact_bytes))
                          print(f"  CHAMPION joblib.load SUCCEEDED: {type(model).__name__}")
                      except Exception:
                          print("  CHAMPION joblib.load FAILED:")
                          traceback.print_exc()
          finally:
              session.close()
          EOF
