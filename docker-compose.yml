services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./:/app"]
    # --reload-dir scopes the file watcher to actual Python source -- without
    # it, --reload watches the ENTIRE bind-mounted repo (apps/web/node_modules,
    # .next build output, etc.), so editing frontend files pointlessly
    # restarts the API too. Found by hitting exactly that thrashing firsthand
    # while developing apps/web against this same compose stack.
    command:
      [
        "uv", "run", "uvicorn", "apps.api.main:app",
        "--host", "0.0.0.0", "--port", "8000", "--reload",
        "--reload-dir", "app", "--reload-dir", "apps/api", "--reload-dir", "packages",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    env_file: .env
    environment:
      # api's own compose-network hostname, not localhost -- mirrors the
      # DATABASE_URL override above. APP_SHARED_TOKEN comes from the root
      # .env via env_file: it MUST be the same value the api service reads,
      # since apps/web/lib/api-client.ts sends it as the api service's own
      # Bearer token.
      API_BASE_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
