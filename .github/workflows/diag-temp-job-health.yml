name: DIAG TEMP job health

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Survey most recent run of every real job type
        run: |
          uv run python - <<'EOF'
          from datetime import UTC, datetime

          from sqlalchemy import select

          from packages.database.models.job import Job
          from packages.database.session import SessionLocal
          from packages.domain.jobs import JobStatus, JobType

          session = SessionLocal()
          try:
              now = datetime.now(UTC)
              for job_type in JobType:
                  most_recent = session.execute(
                      select(Job.status, Job.created_at, Job.error_code, Job.error_message)
                      .where(Job.job_type == job_type)
                      .order_by(Job.created_at.desc())
                      .limit(1)
                  ).first()
                  most_recent_success = session.execute(
                      select(Job.created_at)
                      .where(Job.job_type == job_type, Job.status == JobStatus.SUCCEEDED)
                      .order_by(Job.created_at.desc())
                      .limit(1)
                  ).scalar_one_or_none()

                  recent_failures = session.execute(
                      select(Job.status, Job.created_at)
                      .where(Job.job_type == job_type)
                      .order_by(Job.created_at.desc())
                      .limit(5)
                  ).all()
                  failure_streak = 0
                  for status, _ in recent_failures:
                      if status == JobStatus.FAILED:
                          failure_streak += 1
                      else:
                          break

                  if most_recent is None:
                      print(f"{job_type.value}: NEVER RUN")
                      continue

                  status, created_at, error_code, error_message = most_recent
                  age_hours = (now - created_at).total_seconds() / 3600
                  success_age = f"{(now - most_recent_success).total_seconds() / 3600:.1f}h ago" if most_recent_success else "NEVER SUCCEEDED"
                  flag = ""
                  if failure_streak >= 3:
                      flag = f" <-- {failure_streak} CONSECUTIVE FAILURES"
                  elif status == JobStatus.FAILED:
                      flag = " <-- most recent attempt FAILED"

                  print(
                      f"{job_type.value}: most_recent={status.value} ({age_hours:.1f}h ago), "
                      f"last_success={success_age}, error_code={error_code}{flag}"
                  )
                  if status == JobStatus.FAILED:
                      print(f"    error_message={error_message}")
          finally:
              session.close()
          EOF
