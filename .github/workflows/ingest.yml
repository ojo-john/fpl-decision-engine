name: Ingest

# Manual ingestion job runner (workflow_dispatch only). Supports both
# `data_ingestion` (the full pass: rules sync + teams/positions/players/
# gameweeks/fixtures) and `rules_sync` (lighter-weight, on-demand rule-change
# check only) via the `job_type` input. Spins up its own ephemeral Postgres
# service container, same pattern as health.yml — see that file's docstring
# for the rationale.
on:
  workflow_dispatch:
    inputs:
      job_type:
        description: "Which ingestion job to run"
        required: true
        type: choice
        options:
          - data_ingestion
          - rules_sync
        default: data_ingestion
      requested_by:
        description: "Who is requesting this run (defaults to the triggering actor)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fpl_decision_engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpl -d fpl_decision_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fpl:changeme@localhost:5432/fpl_decision_engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Resolve requested_by
        id: requested_by
        run: |
          value="${{ github.event.inputs.requested_by }}"
          if [ -z "$value" ]; then
            value="${{ github.actor }}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Run ${{ github.event.inputs.job_type }} job
        run: |
          uv run python scripts/run_job.py \
            --job-type "${{ github.event.inputs.job_type }}" \
            --requested-by "${{ steps.requested_by.outputs.value }}" \
            --trigger-type github_manual \
            --git-commit-sha "${{ github.sha }}" \
            > job_summary.json
          cat job_summary.json

      - name: Append job summary
        if: always()
        run: |
          python - <<'EOF'
          import json
          import os

          with open("job_summary.json") as f:
              job = json.load(f)

          output = job.get("output") or {}
          report_markdown = output.get("report_markdown")

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a") as summary:
              summary.write(f"## {job.get('job_type')} Job Result\n\n")
              summary.write("| Field | Value |\n| --- | --- |\n")
              summary.write(f"| job_id | {job.get('job_id')} |\n")
              summary.write(f"| status | {job.get('status')} |\n")
              summary.write(f"| started_at | {job.get('started_at')} |\n")
              summary.write(f"| completed_at | {job.get('completed_at')} |\n")
              summary.write(f"| error_code | {job.get('error_code')} |\n")
              summary.write(f"| error_message | {job.get('error_message')} |\n")
              summary.write("\n")
              if report_markdown:
                  summary.write(report_markdown)
                  summary.write("\n")
          EOF

      - name: Upload job summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-summary
          path: job_summary.json
