name: Scheduled Dispatcher

# Milestone-1 cadence: every 4 hours. This is still NOT the real scheduling
# logic — it exists to prove out the ephemeral-Postgres + idempotent-job CI
# pattern end-to-end, now dispatching the real `data_ingestion` job instead of
# `system_health`. Real deadline-aware scheduling (informed by FPL gameweek
# deadlines, e.g. tightening cadence near a deadline) replaces this cron in a
# later milestone.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fpl
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: fpl_decision_engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fpl -d fpl_decision_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fpl:changeme@localhost:5432/fpl_decision_engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Compute 4-hour-bucketed idempotency key
        id: key
        run: |
          bucket="$(date -u +%Y-%m-%dT)-$(( $(date -u +%-H) / 4 ))"
          echo "value=scheduled-ingest-${bucket}" >> "$GITHUB_OUTPUT"

      - name: Run job (first call)
        run: |
          uv run python scripts/run_job.py \
            --job-type data_ingestion \
            --requested-by scheduled-dispatcher \
            --trigger-type github_schedule \
            --idempotency-key "${{ steps.key.outputs.value }}" \
            --git-commit-sha "${{ github.sha }}" \
            > job_run_1.json
          cat job_run_1.json

      - name: Run job (second call, same idempotency key)
        run: |
          uv run python scripts/run_job.py \
            --job-type data_ingestion \
            --requested-by scheduled-dispatcher \
            --trigger-type github_schedule \
            --idempotency-key "${{ steps.key.outputs.value }}" \
            --git-commit-sha "${{ github.sha }}" \
            > job_run_2.json
          cat job_run_2.json

      - name: Assert idempotency (same job id, no duplicate row)
        run: |
          python - <<'EOF'
          import json

          with open("job_run_1.json") as f:
              first = json.load(f)
          with open("job_run_2.json") as f:
              second = json.load(f)

          job_id_1 = first["job_id"]
          job_id_2 = second["job_id"]

          print(f"first job_id={job_id_1} second job_id={job_id_2}")

          assert job_id_1 == job_id_2, (
              "Idempotency check FAILED: second call created a different job "
              f"({job_id_2}) instead of reusing the first ({job_id_1})."
          )
          print("Idempotency check PASSED: both calls returned the same job id.")
          EOF
