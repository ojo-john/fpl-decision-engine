name: Production DB recovery

# Manual diagnostic/recovery tool (workflow_dispatch ONLY) for the real production database --
# mirrors train-production.yml's own "connects directly to secrets.PROD_DATABASE_URL, never
# echoed/logged" convention. Built after a real incident (2026-08-26): a train-production.yml run
# was force-killed by its own 180-minute job timeout after running far longer than a prior
# successful run (~76 min), and every scheduler-tick run since -- including ones hours after that
# job was killed, and even a fresh Render auto-deploy in between -- has failed to get even
# GET /health to respond within its own timeout. A killed GitHub Actions runner does NOT notify
# Postgres to roll back/close whatever transaction it had open -- an abandoned "idle in
# transaction" connection can sit there holding locks/pool slots indefinitely until something
# explicitly terminates it. This workflow makes that diagnosable and recoverable without needing
# Render dashboard or Supabase dashboard access at all -- only the same PROD_DATABASE_URL secret
# train-production.yml already uses.
#
# `action: diagnose` (default) is read-only -- lists every real connection in pg_stat_activity
# (state, how long it's been in that state, and a query snippet) and does not change anything.
# `action: terminate_idle_in_transaction` additionally terminates connections that are
# specifically "idle in transaction" AND have been in that state for more than
# idle_threshold_minutes -- deliberately narrow (never touches an `active` connection doing real
# work, and never touches idle-in-transaction connections younger than the threshold, which could
# still be a legitimate slow client) rather than a blunt "kill everything" reset.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "diagnose (read-only), terminate_idle_in_transaction, fail_orphaned_transfer_runs, or run_tick_directly (recovery)"
        required: true
        type: choice
        options:
          - diagnose
          - terminate_idle_in_transaction
          - fail_orphaned_transfer_runs
          - run_tick_directly
        default: diagnose
      idle_threshold_minutes:
        description: "Only used by terminate_idle_in_transaction -- minimum time in that state before a connection is considered abandoned"
        required: false
        type: string
        default: "10"
      orphan_age_threshold_minutes:
        description: "Only used by fail_orphaned_transfer_runs -- a RUNNING row older than this (every real successful run so far has finished within 40 min) is considered orphaned by an external process kill, never a still-legitimate in-flight run"
        required: false
        type: string
        default: "90"

jobs:
  prod-db-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync

      - name: Verify PROD_DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL repository secret is not set -- see docs/deployment.md."
            exit 1
          fi

      - name: Diagnose pg_stat_activity
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import text

          from packages.database.session import SessionLocal

          session = SessionLocal()
          try:
              rows = session.execute(
                  text(
                      """
                      select
                          pid,
                          state,
                          application_name,
                          now() - state_change as time_in_state,
                          now() - query_start as time_in_query,
                          wait_event_type,
                          wait_event,
                          left(query, 200) as query_snippet
                      from pg_stat_activity
                      where pid <> pg_backend_pid()
                      order by state_change asc
                      """
                  )
              ).mappings().all()
              print(f"{len(rows)} connection(s) (excluding this diagnostic session itself):\n")
              for row in rows:
                  print(dict(row))

              champion_rows = session.execute(
                  text(
                      """
                      select id, model_name, model_family, lifecycle_state, is_champion,
                             (artifact_bytes is not null) as has_artifact, trained_at
                      from model_versions
                      where is_champion = true
                      """
                  )
              ).mappings().all()
              print("\nCurrent champion(s):\n")
              for row in champion_rows:
                  print(dict(row))

              recent_reconciliation_runs = session.execute(
                  text(
                      """
                      select id, status, started_at, completed_at, output_json, error_code, error_message
                      from jobs
                      where job_type = 'stale_job_reconciliation'
                      order by started_at desc
                      limit 3
                      """
                  )
              ).mappings().all()
              print("\nRecent STALE_JOB_RECONCILIATION runs:\n")
              for row in recent_reconciliation_runs:
                  print(dict(row))

              transfer_rows = session.execute(
                  text(
                      """
                      select t.id, t.run_status, t.recommended_transfers_count,
                             t.recommended_net_horizon_points_gain, t.error_code, t.error_message,
                             t.started_at, t.completed_at,
                             j.trigger_type, j.status as job_status, j.error_code as job_error_code,
                             j.error_message as job_error_message
                      from transfer_optimization_runs t
                      left join jobs j on j.id = t.job_id
                      order by t.started_at desc
                      limit 8
                      """
                  )
              ).mappings().all()
              print("\nRecent transfer_optimization_runs (joined to jobs):\n")
              for row in transfer_rows:
                  print(dict(row))
          finally:
              session.close()
          EOF

      - name: Terminate abandoned idle-in-transaction connections
        if: github.event.inputs.action == 'terminate_idle_in_transaction'
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import text

          from packages.database.session import SessionLocal

          threshold_minutes = "${{ github.event.inputs.idle_threshold_minutes }}"

          session = SessionLocal()
          try:
              rows = session.execute(
                  text(
                      """
                      select pid, terminate_query.terminated, now() - state_change as time_in_state
                      from pg_stat_activity
                      cross join lateral (
                          select pg_terminate_backend(pg_stat_activity.pid) as terminated
                          where pg_stat_activity.pid <> pg_backend_pid()
                            and pg_stat_activity.state = 'idle in transaction'
                            and now() - pg_stat_activity.state_change > (:threshold || ' minutes')::interval
                      ) as terminate_query
                      """
                  ),
                  {"threshold": threshold_minutes},
              ).mappings().all()
              if not rows:
                  print("No idle-in-transaction connections older than the threshold were found.")
              for row in rows:
                  print(dict(row))
              session.commit()
          finally:
              session.close()
          EOF

      - name: Fail orphaned transfer_optimization_runs (and their jobs rows)
        if: github.event.inputs.action == 'fail_orphaned_transfer_runs'
        run: |
          uv run python - <<'EOF'
          from datetime import UTC, datetime, timedelta

          from sqlalchemy import select

          from packages.database.models.job import Job
          from packages.database.models.transfer_optimization_run import TransferOptimizationRun
          from packages.database.session import SessionLocal
          from packages.domain.jobs import JobStatus
          from packages.domain.transfers import TransferOptimizationRunStatus

          threshold_minutes = int("${{ github.event.inputs.orphan_age_threshold_minutes }}")
          cutoff = datetime.now(UTC) - timedelta(minutes=threshold_minutes)
          error_message = (
              f"Orphaned: still RUNNING more than {threshold_minutes} minutes after it started, with "
              "no terminal status ever written -- this app's own 'insert RUNNING before work' safety "
              "net only protects against in-process exceptions, not the process itself being killed "
              "externally (a Render redeploy, OOM, resource contention from a concurrent request). "
              "Marked FAILED by prod-db-recovery.yml's fail_orphaned_transfer_runs action, not a real "
              "in-process failure -- see ARCHITECTURE.md for the real incident this traces to."
          )

          session = SessionLocal()
          try:
              orphans = session.execute(
                  select(TransferOptimizationRun).where(
                      TransferOptimizationRun.run_status == TransferOptimizationRunStatus.RUNNING,
                      TransferOptimizationRun.started_at < cutoff,
                  )
              ).scalars().all()
              if not orphans:
                  print(f"No transfer_optimization_runs RUNNING for more than {threshold_minutes} minutes.")
              for run in orphans:
                  run.run_status = TransferOptimizationRunStatus.FAILED
                  run.error_code = "ORPHANED_PROCESS_KILLED"
                  run.error_message = error_message
                  run.completed_at = datetime.now(UTC)
                  if run.job_id is not None:
                      job = session.get(Job, run.job_id)
                      if job is not None and job.status == JobStatus.RUNNING:
                          job.status = JobStatus.FAILED
                          job.error_code = "ORPHANED_PROCESS_KILLED"
                          job.error_message = error_message
                          job.completed_at = datetime.now(UTC)
                  print(f"Marked FAILED: transfer_optimization_run_id={run.id}, started_at={run.started_at}")
              session.commit()
          finally:
              session.close()
          EOF

      - name: Call run_tick() directly against the real database (bypasses Render entirely)
        if: github.event.inputs.action == 'run_tick_directly'
        run: |
          uv run python - <<'EOF'
          import logging
          logging.basicConfig(level=logging.INFO)

          from sqlalchemy import select

          from app.scheduling.tick import run_tick
          from packages.database.models.job import Job
          from packages.database.session import SessionLocal
          from packages.domain.jobs import JobType

          run_tick()
          print("run_tick() completed")

          session = SessionLocal()
          try:
              rows = session.execute(
                  select(Job)
                  .where(Job.job_type == JobType.STALE_JOB_RECONCILIATION)
                  .order_by(Job.created_at.desc())
                  .limit(3)
              ).scalars().all()
              print(f"\n{len(rows)} STALE_JOB_RECONCILIATION job row(s) found in THIS SAME process:\n")
              for row in rows:
                  print(row.id, row.status, row.started_at, row.completed_at, row.error_code, row.error_message)
          finally:
              session.close()
          EOF
